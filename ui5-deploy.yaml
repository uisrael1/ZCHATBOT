# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: zchatbot
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: Demo21
          url: http://af5ddpd21da00.dimensiondata.com:44300/
          client: '100'
        app:
          name: ZCHATBOT
          description: Apollo's first deployment
          package: $TMP
          transport: ''
        exclude:
          - /test/
